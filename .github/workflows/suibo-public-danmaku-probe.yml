name: Suibo public danmaku transport probe
# 2.3.16: preserve this specialist check for manual runs only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe documented non-credential endpoints without storing bodies
        run: python3 -u scripts/probe_suibo_public_danmaku.py
