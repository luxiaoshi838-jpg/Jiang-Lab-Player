name: Suibo 2.3.20 yt-dlp validation and installable candidates
on:
  push:
    branches: [feature/suibo-2.3.20-ytdlp-url]
permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Unit tests
        run: flutter test test/yt_dlp_url_service_test.dart test/playback_recovery_service_test.dart test/verified_playable_episode_test.dart
      - name: Analyze new URL resolver and settings entry
        run: flutter analyze lib/services/player/yt_dlp_url_service.dart lib/pages/settings/yt_dlp_url_page.dart lib/pages/settings/settings_page.dart lib/pages/settings/settings_module.dart

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      SUIBO_DANMU_API_URL: https://suibo-danmaku.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup missing' }
      - name: Build Flutter Windows release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --dart-define=SUIBO_DANMU_API_URL=$env:SUIBO_DANMU_API_URL
          if ($LASTEXITCODE -ne 0) { throw 'Flutter build failed' }
      - name: Bundle upstream yt-dlp with SHA256 verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21'
          $release = Join-Path $PWD 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'yt-dlp.exe'
          $sums = Join-Path $env:RUNNER_TEMP 'yt-dlp-2026.10.21-SHA2-256SUMS'
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile $sums
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile $exe
          $row = Get-Content $sums | Where-Object { $_ -match '^([0-9a-fA-F]{64})\s+\*?yt-dlp\.exe\s*$' } | Select-Object -First 1
          if (-not $row) { throw 'Cannot find pinned upstream yt-dlp checksum' }
          $expected = ([regex]::Match($row, '^([0-9a-fA-F]{64})')).Groups[1].Value
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'yt-dlp checksum mismatch' }
          "yt-dlp v2026.10.21 verified SHA256: $actual"
      - name: Create versioned installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Suibo2320'
          & ./scripts/build_windows_installer.ps1 -OutputDirectory $dir -SkipFlutterBuild
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $setup = Join-Path $dir 'Suibo-Setup-2.3.20-Windows-x64.exe'
          $report = Join-Path $dir 'Suibo-Windows-install-report-20320.txt'
          if (!(Test-Path $setup) -or !(Test-Path $report)) { throw 'Missing release files' }
          "SUIBO_DIR=$dir" >> $env:GITHUB_ENV
      - name: Smoke install and overwrite previous version
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          $old = Join-Path $env:RUNNER_TEMP 'Suibo2319'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          $release = Join-Path $PWD 'build\windows\x64\runner\Release'
          & $iscc '/DMyAppVersion=2.3.19' "/DFlutterReleaseDir=$release" "/DInstallerOutputDir=$old" 'installer\windows\Suibo.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic 2.3.19 failed' }
          $app = Join-Path $env:RUNNER_TEMP 'Suibo2320Overlay'
          $previous = Join-Path $old 'Suibo-Setup-2.3.19-Windows-x64.exe'
          $current = Join-Path $env:SUIBO_DIR 'Suibo-Setup-2.3.20-Windows-x64.exe'
          foreach ($installer in @($previous, $current, $current)) {
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$app"
            )
            if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
            foreach ($file in @('suibo.exe', 'flutter_windows.dll', 'yt-dlp.exe', 'data\icudtl.dat')) {
              if (!(Test-Path (Join-Path $app $file))) { throw "Missing: $file" }
            }
          }
          Add-Content -Path (Join-Path $env:SUIBO_DIR 'Suibo-Windows-install-report-20320.txt') -Value 'Synthetic 2.3.19 -> 2.3.20 upgrade, yt-dlp bundled, reinstall: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: suibo-2.3.20-windows-installer
          path: |
            ${{ env.SUIBO_DIR }}/*.exe
            ${{ env.SUIBO_DIR }}/*.txt
          retention-days: 3
          if-no-files-found: error

  android-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_SUIBO_ALLOW_UNSIGNED_CANDIDATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
      - name: Build private-signing candidate
        run: |
          flutter pub get
          flutter build apk --release --dart-define=SUIBO_DANMU_API_URL=https://suibo-danmaku.onrender.com
          mkdir -p "$RUNNER_TEMP/suibo2320"
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -f "$apk"
          cp "$apk" "$RUNNER_TEMP/suibo2320/REQUIRES-ORIGINAL-DRIVE-KEY-SIGNING.apk"
          jarpath="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          test -f "$jarpath"
          cp "$jarpath" "$RUNNER_TEMP/suibo2320/apksigner.jar"
          sha256sum "$RUNNER_TEMP/suibo2320/"*.apk > "$RUNNER_TEMP/suibo2320/SHA256.txt"
          echo 'Unsigned staging only. Sign with original Google Drive JKS.' > "$RUNNER_TEMP/suibo2320/READ-ME-FIRST.txt"
          echo "SUIBO_UNSIGNED_DIR=$RUNNER_TEMP/suibo2320" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: suibo-2.3.20-android-unsigned-private-signing
          path: ${{ env.SUIBO_UNSIGNED_DIR }}
          retention-days: 3
          if-no-files-found: error
