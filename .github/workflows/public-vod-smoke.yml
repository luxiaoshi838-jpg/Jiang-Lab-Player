name: Public VOD discovery and HLS smoke
# 2.3.16: preserve legacy checks for manual runs only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-vod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Real public API search then inspect playback manifest
        run: python3 scripts/smoke_public_vod.py
