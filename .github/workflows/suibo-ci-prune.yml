name: Suibo one-time stale PR run cleanup
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/suibo-ci-prune.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prune-obsolete-runs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel obsolete runs of this branch, preserve current head
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.HEAD_REF;
            const keepSha = process.env.HEAD_SHA;
            const states = ['queued', 'in_progress', 'waiting', 'requested'];
            const targets = new Map();
            for (const status of states) {
              for (let page = 1; page <= 3; page++) {
                const response = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, branch, status, per_page: 100, page
                });
                for (const run of response.data.workflow_runs) {
                  if (run.event !== 'pull_request' ||
                      run.head_branch !== branch ||
                      run.head_sha === keepSha ||
                      run.id === context.runId) continue;
                  targets.set(run.id, run.name);
                }
                if (response.data.workflow_runs.length < 100) break;
              }
            }
            const entries = [...targets.entries()].slice(0, 180);
            let accepted = 0;
            let failed = 0;
            for (let i = 0; i < entries.length; i += 4) {
              const batch = entries.slice(i, i + 4);
              const done = await Promise.allSettled(batch.map(([run_id]) =>
                github.rest.actions.cancelWorkflowRun({owner, repo, run_id})));
              done.forEach((result, index) => {
                if (result.status === 'fulfilled') accepted++;
                else {
                  failed++;
                  core.warning('Cancel ' + batch[index][0] + ' failed: ' +
                    String(result.reason).slice(0, 160));
                }
              });
            }
            core.info('Obsolete PR runs: ' + targets.size +
              '; cancellation accepted: ' + accepted + '; failed: ' + failed);
            await core.summary.addHeading('Suibo CI stale-run cleanup')
              .addRaw('Branch: ' + branch + ', preserved SHA: ' + keepSha + '\n')
              .addRaw('Found: ' + targets.size + ', accepted: ' + accepted +
                ', failed: ' + failed)
              .write();
