name: VOD remembered danmaku links
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/services/danmaku/manual_danmaku_link_store_test.dart test/services/danmaku/media_danmaku_match_test.dart
      - run: flutter analyze lib/services/danmaku/manual_danmaku_link_store.dart lib/pages/player/danmaku_source_sheet.dart lib/pages/player/player_item.dart lib/pages/video/video_controller.dart test/services/danmaku/manual_danmaku_link_store_test.dart
