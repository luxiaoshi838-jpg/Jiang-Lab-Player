name: Suibo 2.3.19 installer candidates
on:
  push:
    branches: [feature/suibo-2.3.19-smart-playback]
permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # A public URL only. Never embed private DanDan API keys in an artifact.
      SUIBO_DANMU_API_URL: https://suibo-danmaku.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6 not available' }
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Suibo2319'
          & ./scripts/build_windows_installer.ps1 -OutputDirectory $dir
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $exe = Join-Path $dir 'Suibo-Setup-2.3.19-Windows-x64.exe'
          $report = Join-Path $dir 'Suibo-Windows-install-report-20319.txt'
          if (!(Test-Path $exe) -or !(Test-Path $report)) { throw 'Installer/report missing' }
          if ((Get-Item $exe).Length -lt 1048576) { throw 'Installer is truncated' }
          "SUIBO_INSTALLER_DIR=$dir" >> $env:GITHUB_ENV
      - name: Verify overwrite upgrade with original AppId
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          $old = Join-Path $env:RUNNER_TEMP 'Suibo2318'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          $release = Join-Path $PWD 'build\windows\x64\runner\Release'
          & $iscc '/DMyAppVersion=2.3.18' "/DFlutterReleaseDir=$release" "/DInstallerOutputDir=$old" 'installer\windows\Suibo.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic previous installer failed' }
          $first = Join-Path $old 'Suibo-Setup-2.3.18-Windows-x64.exe'
          $latest = Join-Path $env:SUIBO_INSTALLER_DIR 'Suibo-Setup-2.3.19-Windows-x64.exe'
          $app = Join-Path $env:RUNNER_TEMP 'SuiboOverlayTest'
          foreach ($installer in @($first, $latest, $latest)) {
            $install = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$app"
            )
            if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }
            foreach ($file in @('suibo.exe','flutter_windows.dll','data\icudtl.dat')) {
              if (-not (Test-Path (Join-Path $app $file))) { throw "Missing file: $file" }
            }
          }
          Add-Content -Path (Join-Path $env:SUIBO_INSTALLER_DIR 'Suibo-Windows-install-report-20319.txt') -Value 'Synthetic 2.3.18 to 2.3.19 overwrite and 2.3.19 reinstall: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: suibo-2.3.19-windows-installer-candidate
          path: |
            ${{ env.SUIBO_INSTALLER_DIR }}/*.exe
            ${{ env.SUIBO_INSTALLER_DIR }}/*.txt
          retention-days: 1
          if-no-files-found: error

  android-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_SUIBO_ALLOW_UNSIGNED_CANDIDATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
      - name: Build unsigned Android release candidate
        run: |
          flutter pub get
          flutter build apk --release --dart-define=SUIBO_DANMU_API_URL=https://suibo-danmaku.onrender.com
          mkdir -p "$RUNNER_TEMP/suibo2319-unsigned"
          apk='build/app/outputs/flutter-apk/app-release.apk'
          if [ ! -f "$apk" ]; then
            apk="$(find build/app/outputs/apk -name '*release*unsigned.apk' -type f | head -n 1)"
          fi
          test -f "$apk"
          cp "$apk" "$RUNNER_TEMP/suibo2319-unsigned/REQUIRES-ORIGINAL-DRIVE-KEY-SIGNING.apk"
          sha256sum "$RUNNER_TEMP/suibo2319-unsigned/"*.apk > "$RUNNER_TEMP/suibo2319-unsigned/SHA256.txt"
          printf 'NOT A USER INSTALLABLE UPGRADE. Requires original Google Drive signing key.\n' > "$RUNNER_TEMP/suibo2319-unsigned/READ-ME-FIRST.txt"
          echo "SUIBO_UNSIGNED_DIR=$RUNNER_TEMP/suibo2319-unsigned" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: suibo-2.3.19-android-unsigned-private-signing
          path: ${{ env.SUIBO_UNSIGNED_DIR }}
          retention-days: 1
          if-no-files-found: error
