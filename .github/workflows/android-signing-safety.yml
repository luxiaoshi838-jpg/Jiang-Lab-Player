name: Private Android release signing safety
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  signing-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Test signing ZIP parser with fake credentials
        run: python3 -m unittest discover -s scripts/tests -p 'test_private_android_release.py'
      - name: Check signing tool entry point
        run: python3 scripts/private_android_release.py --help
      - name: Flutter dependencies
        run: flutter pub get
      - name: Confirm Android debug still builds
        run: flutter build apk --debug
      - name: Fail closed if release key is absent
        shell: bash
        run: |
          set +e
          flutter build apk --release > signing-guard-output.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: release build accepted missing signing credentials"
            exit 1
          fi
          if ! grep -q "Private Android release signing is required" signing-guard-output.log; then
            echo "ERROR: release build failed for another reason"
            tail -n 35 signing-guard-output.log
            exit 1
          fi
          rm -f signing-guard-output.log
      # No upload-artifact, release attachment, or private keys.
