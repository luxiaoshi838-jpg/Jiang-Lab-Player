name: Dart engine real VOD smoke
# 2.3.16: preserve legacy checks for manual runs only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart-real-vod:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Real VOD / auto CMS smoke in the Flutter test host
        run: flutter test test/real_vod_network_smoke_test.dart --reporter expanded
