name: Dart engine real VOD smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dart-real-vod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Actual Suibo Dart rule engine -> published video -> HLS
        run: dart run tool/smoke_real_plugin.dart
