name: Suibo temporary installer delivery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Build installable Windows setup
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "suibo-delivery"
          & ./scripts/build_windows_installer.ps1 -OutputDirectory $out
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
          $exe = Join-Path $out "Suibo-Setup-2.3.12-Windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "Missing installation EXE" }
          if ((Get-Item $exe).Length -lt 1048576) { throw "Truncated installation EXE" }
          echo "SUIBO_SETUP=$exe" >> $env:GITHUB_ENV
          $report = Join-Path $out "Suibo-Windows-install-report-20312.txt"
          echo "SUIBO_REPORT=$report" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: suibo-windows-2.3.12-setup
          path: |
            ${{ env.SUIBO_SETUP }}
            ${{ env.SUIBO_REPORT }}
          retention-days: 1
          if-no-files-found: error
  android-release-temp:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Remove unused preinstalled tools for Android build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
      - name: Generate throwaway build signature (not the real signing key)
        run: |
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/android/suibo-ci-temp.jks" -storepass temporaryTESTonly2026 -keypass temporaryTESTonly2026 -alias temp-ci-only -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Temporary CI Build,O=Suibo,C=US"
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/suibo-ci-temp.jks
          storePassword=temporaryTESTonly2026
          keyAlias=temp-ci-only
          keyPassword=temporaryTESTonly2026
          EOF
      - name: Build universal release APK for private re-signing
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p "$RUNNER_TEMP/suibo-apk-stage"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/suibo-apk-stage/REQUIRES-PRIVATE-RESIGN.apk"
          jarpath=$(find "$ANDROID_HOME/build-tools" -path "*/lib/apksigner.jar" | sort -V | tail -n 1)
          test -f "$jarpath"
          cp "$jarpath" "$RUNNER_TEMP/suibo-apk-stage/apksigner.jar"
          test $(stat -c '%s' "$RUNNER_TEMP/suibo-apk-stage/REQUIRES-PRIVATE-RESIGN.apk") -gt 1048576
          echo "SUIBO_APK_STAGE=$RUNNER_TEMP/suibo-apk-stage" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: suibo-android-2.3.12-private-resign
          path: ${{ env.SUIBO_APK_STAGE }}
          retention-days: 1
          if-no-files-found: error
