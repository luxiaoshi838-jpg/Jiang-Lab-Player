name: Suibo real CMS home catalogue probe
# 2.3.16: preserve legacy checks for manual runs only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-category:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual catalog sources and genre categories
        run: python3 scripts/smoke_suibo_home.py
