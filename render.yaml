services:
  - type: web
    name: suibo-danmaku
    runtime: docker
    plan: free
    dockerfilePath: ./services/danmaku/Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: SUIBO_BACKEND_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
