plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// 随播签名文件不得提交仓库；仅从本地 key.properties 中读取。
def suiboKeyProperties = new Properties()
def suiboKeyFile = rootProject.file('key.properties')
if (suiboKeyFile.exists()) {
    suiboKeyFile.withInputStream { suiboKeyProperties.load(it) }
}
def suiboSigningFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def suiboSigningConfigured = suiboKeyFile.exists() &&
        suiboSigningFields.every { suiboKeyProperties[it]?.toString()?.trim() }

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.jianglab.suibo"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        suiboRelease {
            if (suiboSigningConfigured) {
                storeFile file(suiboKeyProperties['storeFile'])
                storePassword suiboKeyProperties['storePassword']
                keyAlias suiboKeyProperties['keyAlias']
                keyPassword suiboKeyProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Never silently sign a release with Android's debug certificate.
            // The verify task below fails an unsigned production build.
            signingConfig suiboSigningConfigured ? signingConfigs.suiboRelease : null
        }
    }
}


tasks.register('verifySuiboReleaseSigning') {
    doLast {
        if (!suiboSigningConfigured) {
            throw new GradleException('Private Android release signing is required; see scripts/private_android_release.py')
        }
        if (!file(suiboKeyProperties['storeFile']).isFile()) {
            throw new GradleException('Private Android signing keystore file does not exist')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifySuiboReleaseSigning')
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
